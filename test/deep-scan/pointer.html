<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer effects fixture</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0e0f13; color: #eee; }
  .stage { display: flex; gap: 80px; align-items: center; justify-content: center; min-height: 100vh; }
  .magnetic { width: 160px; height: 60px; border: 0; border-radius: 30px; background: #5b4cf0; color: #fff; font-size: 16px; cursor: pointer; }
  .tilt-card { width: 380px; height: 280px; border-radius: 20px; background: linear-gradient(135deg, #22d3ee, #7c3aed); transform: perspective(600px); transform-style: preserve-3d; }
  .proximity { width: 120px; height: 120px; border-radius: 16px; background: #f59e0b; transition: transform .15s ease; }
</style>
</head>
<body>
  <div class="stage">
    <button class="magnetic">Hover me</button>
    <div class="tilt-card" aria-label="tilt card"></div>
    <div class="proximity" aria-label="proximity"></div>
  </div>
  <script>
    // Magnetic: the button leans toward the cursor (JS, not CSS).
    const btn = document.querySelector('.magnetic');
    document.addEventListener('mousemove', e => {
      const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      btn.style.transform = dist < 220 ? `translate(${(e.clientX - cx) * 0.4}px, ${(e.clientY - cy) * 0.4}px)` : 'translate(0px, 0px)';
    });
    // Tilt: the card rotates in 3D following the pointer within it.
    const card = document.querySelector('.tilt-card');
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(600px) rotateY(${px * 22}deg) rotateX(${-py * 22}deg)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = 'perspective(600px)'; });
    // Proximity: a tile that scales up when the pointer is near.
    const prox = document.querySelector('.proximity');
    document.addEventListener('mousemove', e => {
      const r = prox.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      prox.style.transform = Math.hypot(e.clientX - cx, e.clientY - cy) < 160 ? 'scale(1.3)' : 'scale(1)';
    });
  </script>
</body>
</html>
