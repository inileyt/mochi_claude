<!doctype html>
<!-- Image Scan test page (the smoke test brings Mochi in with the toolbar button).
     ?x=<port>: the cross-origin image comes from a second local server on that port. -->
<html lang="en">
<head><meta charset="utf-8"><title>Image Scan fixtures</title>
<style>
  body { margin: 0; padding: 24px; font: 14px system-ui; background: #fff; color: #222; }
  figure { margin: 0 0 32px; }
  img, .bg { display: block; }
  .bg { width: 640px; height: 320px; background-image: linear-gradient(90deg, #ff006e, #3a86ff); }
</style>
</head>
<body>
<h1>Image Scan fixtures</h1>
<figure><img id="poster" src="poster.png" width="900" height="600" alt=""></figure>
<figure><img id="russian" src="russian.png" width="800" height="300" alt=""></figure>
<figure><img id="armenian" src="armenian.png" width="820" height="300" alt=""></figure>
<figure><img id="flat" src="flat.png" width="300" height="300" alt="A sunny day over two green hills"></figure>
<figure><img id="gradient" src="gradient.png" width="800" height="450" alt=""></figure>
<figure><img id="cross" width="640" height="360" alt=""></figure>
<figure><div id="bg" class="bg"></div></figure>
<figure><img id="tall" src="tall.png" width="400" height="2000" alt=""></figure>
<p style="height:400px">The end.</p>
<script>
  const port = new URLSearchParams(location.search).get('x');
  if (port) document.getElementById('cross').src = `http://127.0.0.1:${port}/test/image-scan/cross.png`;
</script>
</body>
</html>
