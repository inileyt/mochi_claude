<!doctype html>
<!-- Video + hero scan fixture: a hero with a looping CSS animation and a scroll-reveal element,
     and a <video> with a poster, two sources and play attributes. -->
<html lang="en"><head><meta charset="utf-8"><title>Media scan fixture</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; }
  .hero { min-height: 420px; width: 100%; padding: 40px; background: linear-gradient(120deg, #1e1b4b, #4f46e5); color: #fff; }
  @keyframes floaty { 0% { transform: none } 50% { transform: translateY(-8px) } 100% { transform: none } }
  .title { font-size: 40px; margin: 0 0 12px; animation: floaty 3s ease-in-out infinite; }
  .card { transition: opacity .6s ease-out, transform .6s ease-out; padding: 14px; background: rgba(255,255,255,.1); border-radius: 10px; margin-top: 16px; }
  .btn { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #fff; color: #1e1b4b; border-radius: 8px; text-decoration: none; }
  video { display: block; width: 480px; max-width: 100%; margin: 30px; border-radius: 12px; object-fit: cover; }
</style></head>
<body>
  <header class="hero" id="hero">
    <h1 class="title">A beautiful hero</h1>
    <p class="sub">With a gentle floating title and a card that reveals.</p>
    <div class="card">This card fades and slides in.</div>
    <a class="btn" href="#next">Get started</a>
  </header>

  <video id="vid" poster="../../icons/icon-48.png" loop muted autoplay playsinline>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.webm" type="video/webm">
  </video>
  <div id="next">After the hero.</div>
</body></html>
