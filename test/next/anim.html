<!doctype html>
<!-- Scan-animation fixture: a CSS @keyframes element, a JS (rAF) moved element, and a still one. -->
<html lang="en"><head><meta charset="utf-8"><title>Animation fixture</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #ffffff; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  #css-anim { width: 80px; height: 80px; margin: 40px; background: #6366f1; border-radius: 12px; animation: pulse 2s ease-in-out infinite; }
  #js-anim { width: 60px; height: 60px; margin: 40px; background: #ef4444; border-radius: 50%; }
  #still { width: 60px; height: 60px; margin: 40px; background: #10b981; }
</style></head>
<body>
  <div id="css-anim"></div>
  <div id="js-anim"></div>
  <div id="still"></div>
  <canvas id="canvas-anim" width="90" height="90" style="margin:40px"></canvas>
  <script>
    const cv = document.getElementById('canvas-anim'), g = cv.getContext('2d'); let a = 0;
    (function draw(){ a += 0.05; g.clearRect(0,0,90,90); g.fillStyle='#8b5cf6'; g.beginPath(); g.arc(45+Math.sin(a)*25, 45, 16, 0, 7); g.fill(); requestAnimationFrame(draw); })();
    const el = document.getElementById('js-anim'); let s = 0;
    (function tick() { s += 0.04; el.style.transform = `translateY(${(Math.sin(s) * 22).toFixed(1)}px)`; requestAnimationFrame(tick); })();
  </script>
</body></html>
