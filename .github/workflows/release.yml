# Every new version on main becomes a GitHub release with the zip people install.
# Bump "version" in manifest.json, push to main, and this does the rest.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version from manifest.json
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests
        if: steps.check.outputs.exists == 'false'
        run: for t in test/*.test.js; do node "$t"; done

      - name: Build the zip
        if: steps.check.outputs.exists == 'false'
        run: ./dev/build-zip.sh

      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          ./dev/release-notes.sh > dist/NOTES.md
          gh release create "v$v" dist/mochi-extension.zip "dist/mochi-extension-$v.zip" \
            --title "Mochi $v" --notes-file dist/NOTES.md --latest
