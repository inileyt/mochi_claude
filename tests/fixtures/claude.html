<!doctype html>
<!-- A claude.ai-shaped page for the smoke test (the real extension injects Mochi). -->
<html lang="en">
<head><meta charset="utf-8"><title>Claude</title>
<style>body{margin:0;font:16px system-ui;background:#faf9f5;color:#29261b;display:flex;flex-direction:column;height:100vh}main{flex:1;overflow:auto;padding:24px;max-width:720px;margin:0 auto;width:100%}fieldset{max-width:720px;margin:0 auto 20px;width:calc(100% - 32px);border:1px solid #e3dfd2;border-radius:18px;background:#fff;padding:12px 14px}[contenteditable]{min-height:44px;outline:none}</style>
</head>
<body>
<main id="thread">
  <div data-testid="user-message">Hi Claude!</div>
  <div class="font-claude-response" data-is-streaming="false"><p>Hello! How can I help?</p></div>
</main>
<fieldset><div contenteditable="true" class="ProseMirror" aria-label="Write your prompt to Claude"></div><button aria-label="Send message">↑</button></fieldset>
<script>
  // window.fixture.send(text): a user message, then a reply that streams for ~1.5 s.
  // ?late: the chat (messages + message box) is missing until fixture.show().
  const parts = [document.getElementById('thread'), document.querySelector('fieldset')];
  const late = /[?&]late\b/.test(location.search);
  if (late) parts.forEach(el => el.remove());
  window.fixture = {
    show() { if (!parts[0].isConnected) document.body.prepend(...parts); },
    send(text, reply = 'Sunlight bends in raindrops, reflects, and spreads into colours. That is a rainbow!') {
      const thread = document.getElementById('thread');
      const u = document.createElement('div'); u.dataset.testid = 'user-message'; u.textContent = text; thread.append(u);
      const send = document.querySelector('button[aria-label="Send message"]');
      const stop = document.createElement('button'); stop.setAttribute('aria-label', 'Stop response'); stop.textContent = '■';
      setTimeout(() => {
        send.replaceWith(stop);
        const a = document.createElement('div'); a.className = 'font-claude-response'; a.dataset.isStreaming = 'true'; thread.append(a);
        const words = reply.split(' '); let i = 0;
        const t = setInterval(() => {
          a.textContent += (i ? ' ' : '') + words[i++];
          if (i >= words.length) { clearInterval(t); a.dataset.isStreaming = 'false'; stop.replaceWith(send); }
        }, 120);
      }, 500);
    },
  };
</script>
</body>
</html>
