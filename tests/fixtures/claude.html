<!doctype html>
<!-- A claude.ai-shaped page for the smoke test (the real extension injects Mochi). -->
<html lang="en">
<head><meta charset="utf-8"><title>Claude</title>
<style>body{margin:0;font:16px system-ui;background:#faf9f5;color:#29261b;display:flex;flex-direction:column;height:100vh}main{flex:1;overflow:auto;padding:24px;max-width:720px;margin:0 auto;width:100%}fieldset{max-width:720px;margin:0 auto 20px;width:calc(100% - 32px);border:1px solid #e3dfd2;border-radius:18px;background:#fff;padding:12px 14px}[contenteditable]{min-height:44px;outline:none}</style>
</head>
<body>
<main id="thread">
  <div data-testid="user-message">Hi Claude!</div>
  <div class="font-claude-response" data-is-streaming="false"><p>Hello! How can I help?</p></div>
</main>
<fieldset><div contenteditable="true" class="ProseMirror" aria-label="Write your prompt to Claude"></div><button aria-label="Send message">↑</button></fieldset>
<script>
  // window.fixture.send(text): a user message, then a reply that streams for ~1.5 s.
  // ?late: the chat (messages + message box) is missing until fixture.show().
  const parts = [document.getElementById('thread'), document.querySelector('fieldset')];
  const late = /[?&]late\b/.test(location.search);
  if (late) parts.forEach(el => el.remove());
  // Like claude.ai: a pasted file becomes an attachment card, pasted text goes into the box.
  // Every paste is recorded; Enter in the box counts as "sent" (Mochi must never do that).
  const box = parts[1].querySelector('[contenteditable]'); // (still there when ?late took it out of the page)
  const pastes = [], sent = [];
  box.addEventListener('paste', ev => {
    const files = [...(ev.clipboardData?.files || [])];
    const text = ev.clipboardData?.getData('text/plain') || '';
    pastes.push({ files: files.map(f => ({ name: f.name, type: f.type, size: f.size })), text });
    if (files.length) {
      const card = document.createElement('div'); card.dataset.testid = 'file-thumbnail'; card.textContent = files[0].name;
      box.parentElement.insertBefore(card, box);
    } else if (text) box.append(document.createTextNode(text));
    ev.preventDefault();
  });
  box.addEventListener('keydown', ev => { if (ev.key === 'Enter' && !ev.shiftKey) sent.push(box.textContent); });
  // ?images: a few same-origin images in the thread (Image Scan reads them directly on claude.ai).
  if (/[?&]images\b/.test(location.search)) {
    const c = document.createElement('canvas'); c.width = 360; c.height = 200;
    const g = c.getContext('2d'); g.fillStyle = '#264653'; g.fillRect(0, 0, 360, 200); g.fillStyle = '#e9c46a'; g.fillRect(40, 40, 120, 120);
    const img = document.createElement('img'); img.id = 'upload'; img.alt = 'an uploaded picture'; img.src = c.toDataURL(); img.width = 360; img.height = 200;
    document.getElementById('thread').append(img);
  }
  // fixture.reply(markdown): an answer that streams for a moment, then shows paragraphs and ```lang code blocks.
  // fixture.sendBox(markdown): what's in the message box becomes your message (as if you pressed Enter), then reply(markdown).
  function render(md) {
    const out = document.createElement('div'); out.className = 'font-claude-response'; out.dataset.isStreaming = 'true';
    const parts = md.split(/```([\w-]*)\n([\s\S]*?)```/);
    for (let i = 0; i < parts.length; i += 3) {
      // Like claude.ai's Markdown: numbered lines become a list, addresses become links.
      const inline = (el, text) => { for (const bit of text.split(/(https?:\/\/[^\s)]+)/)) { if (/^https?:/.test(bit)) { const a = document.createElement('a'); a.href = bit; a.textContent = bit; el.append(a); } else el.append(bit); } };
      if (parts[i].trim()) for (const para of parts[i].trim().split(/\n{2,}/)) {
        const lines = para.split('\n');
        if (lines.length > 1 && lines.every(l => /^\d+\.\s/.test(l))) { const ol = document.createElement('ol'); for (const l of lines) { const li = document.createElement('li'); inline(li, l.replace(/^\d+\.\s/, '')); ol.append(li); } out.append(ol); }
        else { const p = document.createElement('p'); inline(p, para); out.append(p); }
      }
      if (i + 2 < parts.length) { const pre = document.createElement('pre'); const code = document.createElement('code'); if (parts[i + 1]) code.className = `language-${parts[i + 1]}`; code.textContent = parts[i + 2]; pre.append(code); out.append(pre); }
    }
    return out;
  }
  function reply(md) {
    const thread = document.getElementById('thread');
    const send = document.querySelector('button[aria-label="Send message"]');
    const stop = document.createElement('button'); stop.setAttribute('aria-label', 'Stop response'); stop.textContent = '■';
    setTimeout(() => {
      send.replaceWith(stop);
      const a = render(md); thread.append(a);
      setTimeout(() => { a.dataset.isStreaming = 'false'; stop.replaceWith(send); }, 900);
    }, 400);
  }
  window.fixture = {
    pastes, sent, reply,
    sendBox(md) {
      const u = document.createElement('div'); u.dataset.testid = 'user-message'; u.textContent = box.textContent;
      document.getElementById('thread').append(u);
      box.textContent = '';
      document.querySelectorAll('[data-testid="file-thumbnail"]').forEach(c => c.remove());
      reply(md);
    },
    show() { if (!parts[0].isConnected) document.body.prepend(...parts); },
    send(text, reply = 'Sunlight bends in raindrops, reflects, and spreads into colours. That is a rainbow!') {
      const thread = document.getElementById('thread');
      const u = document.createElement('div'); u.dataset.testid = 'user-message'; u.textContent = text; thread.append(u);
      const send = document.querySelector('button[aria-label="Send message"]');
      const stop = document.createElement('button'); stop.setAttribute('aria-label', 'Stop response'); stop.textContent = '■';
      setTimeout(() => {
        send.replaceWith(stop);
        const a = document.createElement('div'); a.className = 'font-claude-response'; a.dataset.isStreaming = 'true'; thread.append(a);
        const words = reply.split(' '); let i = 0;
        const t = setInterval(() => {
          a.textContent += (i ? ' ' : '') + words[i++];
          if (i >= words.length) { clearInterval(t); a.dataset.isStreaming = 'false'; stop.replaceWith(send); }
        }, 120);
      }, 500);
    },
  };
</script>
</body>
</html>
